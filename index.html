<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07050d;color:#eee;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text;touch-action:auto}
canvas#c{position:fixed;inset:0;display:block;image-rendering:pixelated}
.serif{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif}
.hidden{display:none!important}
/* HUD */
#hud{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));pointer-events:none}
.bar{height:8px;background:#000a;border:1px solid #000;box-shadow:0 0 0 1px #ffffff26;margin-bottom:5px;position:relative;overflow:hidden;border-radius:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.bar b{position:absolute;left:0;top:0;bottom:0;display:block;background:#ffffff55;transition:width .5s ease .25s}
#hpB i{background:linear-gradient(#ef5a70,#8a1730)}
#stB i{background:linear-gradient(#7be08a,#2d7a3a)}
#mpB i{background:linear-gradient(#8a9aff,#3a3aa8)}
#shB{height:4px;display:none}#shB i{background:linear-gradient(#ffe7a0,#c9932a)}
#info{font-size:12px;text-shadow:0 1px 2px #000;margin-top:2px;display:flex;gap:10px;align-items:center;color:#ddd}
#info b{color:#fff}
#clsTag{color:#ffd27a}
#bMenu{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(74px + env(safe-area-inset-top));width:30px;height:30px;border-radius:8px;border:1px solid #ffd27a66;background:#160f22cc;color:#f2e3c0;font-size:15px;display:flex;align-items:center;justify-content:center}
#topR{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:6px;align-items:center}
#compass{width:38px;height:38px;border-radius:50%;border:1px solid #ffd27a55;background:radial-gradient(#1a1228,#0a0712);position:relative;box-shadow:inset 0 0 6px #000}
#compass i{position:absolute;left:50%;top:50%;width:2px;height:14px;margin-left:-1px;margin-top:-14px;background:linear-gradient(#ff5a5a,#a01020);transform-origin:50% 100%;border-radius:1px}
#compass span{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:8px;margin-top:3px;color:#c9b88f}
#souls{position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(56px + env(safe-area-inset-top));font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none;text-align:right;color:#bbb}
#souls b{color:#d9c7ff;font-size:16px;display:block}
#wpnTag{font-size:11px;color:#f2e3c0;margin-top:2px}
#saveDot{font-size:10px;color:#8fd9a0;opacity:0;transition:opacity .4s}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + env(safe-area-inset-top));width:min(560px,78vw);pointer-events:none}
#bossbar .n{font-size:13px;letter-spacing:2px;color:#f0e6d2;text-shadow:0 1px 3px #000;margin-bottom:3px}
#bossbar .bar{height:9px}#bossbar .bar i{background:linear-gradient(#d4442e,#6e140c)}
#toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:15px;padding:10px 22px;background:linear-gradient(90deg,transparent,#000c 18%,#000c 82%,transparent);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;text-align:center}
#big{position:fixed;left:0;right:0;top:42%;transform:translateY(-50%);text-align:center;font-size:clamp(28px,8vw,60px);letter-spacing:4px;opacity:0;transition:opacity .8s;pointer-events:none;padding:18px 0;background:linear-gradient(90deg,transparent,#000b 25%,#000b 75%,transparent)}
/* buttons */
.gb{position:fixed;width:var(--s);height:var(--s);border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer;
  background:radial-gradient(circle at 34% 28%,#43355e 0%,#211833 45%,#110b1a 100%);
  border:1.5px solid rgba(255,214,140,.6);box-shadow:0 0 0 2px #0009,inset 0 1px 0 #ffffff2a,inset 0 -3px 6px #0008,0 3px 10px #000a;transition:transform .06s}
.gb svg{width:52%;height:52%;fill:none;stroke:#f4e6c6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 1px #000);position:relative;z-index:1}
.gb::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(5,2,10,.72) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.gb.on{transform:scale(.9);border-color:#fff;background:radial-gradient(circle at 34% 28%,#6a5592,#2a1f40 60%,#140d1f)}
.gb.lock{opacity:.35}.gb.nomp svg{stroke:#7d7398}
.gb .k{position:absolute;right:-3px;bottom:-3px;font-size:9px;line-height:1;background:#000c;color:#ffd27a;padding:2px 3px;border-radius:4px;border:1px solid #ffd27a55;z-index:2}
.gb .lbl{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:#d8cbe8;white-space:nowrap;text-shadow:0 1px 2px #000;z-index:2}
.gb.atk{border-color:rgba(255,206,110,.9)}
.gb.sk svg{stroke:#d8c6ff}
.gb.rot{position:static;--s:34px}
#bAtk{--s:64px;right:calc(18px + env(safe-area-inset-right));bottom:calc(40px + env(safe-area-inset-bottom))}
#bDash{--s:48px;right:calc(92px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom))}
#bParry{--s:48px;right:calc(24px + env(safe-area-inset-right));bottom:calc(116px + env(safe-area-inset-bottom))}
#bS1{--s:52px;right:calc(92px + env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom))}
#bS2{--s:52px;right:calc(150px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom))}
#bS3{--s:52px;right:calc(146px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}
#bS4{--s:52px;right:calc(84px + env(safe-area-inset-right));bottom:calc(146px + env(safe-area-inset-bottom))}
#bWpn{--s:40px;right:calc(24px + env(safe-area-inset-right));bottom:calc(176px + env(safe-area-inset-bottom))}
#bAct{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom));padding:9px 20px;border-radius:20px;border:1px solid #ffd27a;background:#1a1222e6;color:#ffd27a;font-size:14px;display:none;touch-action:none;box-shadow:0 0 14px #ffd27a33}
#joy{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid #ffffff2a;background:radial-gradient(#ffffff10,#ffffff04);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff70,#ffffff25);border:1.5px solid #ffd27a88}
/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a061288 0%,#05030acc 75%);padding:20px;overflow:auto;z-index:4}
.tbox{max-width:440px;width:100%;text-align:center}
.logo{font-size:clamp(40px,11vw,62px);letter-spacing:6px;color:#efe4cf;text-shadow:0 0 24px #8a5cff88,0 3px 0 #000}
.sub{letter-spacing:8px;font-size:11px;color:#a99bc7;margin:4px 0 22px}
.form{display:flex;flex-direction:column;gap:10px;background:#120c1ccc;border:1px solid #ffd27a33;border-radius:10px;padding:18px}
.form input{font-size:16px;padding:12px 14px;border-radius:7px;border:1px solid #ffffff2a;background:#0a0712;color:#fff;outline:none;font-family:inherit}

.row{display:flex;gap:8px}.row .btn{flex:1}
.btn{background:linear-gradient(#3b2a52,#1d1430);color:#ffe7b0;border:1px solid #ffd27a88;border-radius:7px;padding:12px 18px;font-size:16px;font-family:inherit;cursor:pointer;letter-spacing:1px;width:100%}

.btn:disabled{opacity:.5}
.msg{min-height:18px;font-size:13px;color:#ff8a8a}
.small{font-size:11px;color:#8f86a3;line-height:1.6}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.who{color:#cfc6dd;margin-bottom:16px;font-size:15px}.who b{color:#ffd27a}
.link{background:none;border:none;color:#8f86a3;text-decoration:underline;font-size:13px;margin-top:8px;cursor:pointer;font-family:inherit}
.cinfo{font-size:12px;color:#a99bc7;margin-top:-4px}
/* book */
#book,#classSel,#confirm,#pause,#ending{z-index:6}
#book{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;padding:12px;overflow:auto}
.pages{display:flex;flex-wrap:wrap;max-width:760px;width:100%;background:#e6d5ae;border:3px solid #6b4a24;border-radius:6px;box-shadow:0 0 0 4px #2b1a0c,0 10px 50px #000;color:#3a2614;max-height:100%;overflow:auto}

#portrait{display:block;margin:4px auto 8px;width:102px;height:105px;image-rendering:pixelated;background:#cbb88c;border:2px solid #8a6a3a}

.st{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px dashed #c4ab7a;font-size:13px}

.der{font-size:11px;color:#6a4a2a;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.wl{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.wl button{display:flex;justify-content:space-between;align-items:center;font-family:inherit;font-size:12px;padding:6px 8px;border:1px solid #b89a63;background:#f1e3bf;border-radius:4px;color:#3a2614;cursor:pointer}

.bfoot{width:100%;display:flex;justify-content:center;padding:10px;background:#d8c290;border-top:2px solid #b89a63}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.cls{background:#1d1430;border:1px solid #ffffff22;border-radius:8px;padding:10px;color:#ddd;font-family:inherit;cursor:pointer;text-align:left}
.cls:hover,.cls:active{border-color:#ffd27a}
.cls h4{margin:0 0 4px;color:#ffd27a;font-size:15px}
.cls p{margin:0;font-size:11px;color:#bbb;line-height:1.5}
.cls p b{color:#d8c6ff;font-weight:600}

#tbg{position:fixed;inset:0;z-index:3;overflow:hidden;background:radial-gradient(ellipse 120% 80% at 70% 18%,#3f78d6 0%,#1f4aa0 22%,#12306f 48%,#0a1a42 75%,#050d26 100%)}

#stars{position:absolute;inset:0;width:100%;height:100%}
.moon{position:absolute;right:9%;top:4%;width:clamp(64px,20vw,110px);height:clamp(64px,20vw,110px);border-radius:50%;background:radial-gradient(circle at 42% 40%,#fffbea 0%,#f6efd2 45%,#d9dcc8 62%,#c9d6f0 70%);box-shadow:0 0 40px 12px #9cc0ff66,0 0 140px 50px #4f86e655}
.moon::after{content:'';position:absolute;left:24%;top:30%;width:18%;height:14%;border-radius:50%;background:#d8d6c0aa;box-shadow:30px 22px 0 -2px #d8d6c088,12px 40px 0 -4px #d8d6c077}
.mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%}
.mist{position:absolute;left:-50%;width:200%;height:22%;bottom:12%;background:radial-gradient(ellipse at center,#6c9cf033 0%,transparent 60%);animation:mist 28s linear infinite}
.mist.m2{bottom:2%;height:18%;animation-duration:40s;animation-direction:reverse;opacity:.8}
@keyframes mist{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.screen{background:none!important}
.screen .tbox{max-width:420px}
.logo{font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(46px,13vw,76px);letter-spacing:8px;line-height:1.1;color:transparent;
  background:linear-gradient(180deg,#fffaf0 0%,#ffe9b0 35%,#e2a94a 55%,#a0631e 62%,#ffd98a 82%,#fff3cf 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 3px 0 #0b1638) drop-shadow(0 0 20px #6aa0ffaa);text-shadow:none;padding:0 6px}

.herobox{position:relative;width:110px;height:118px;margin:6px auto 10px}
.heroT{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:102px;height:105px;image-rendering:pixelated;z-index:1;filter:drop-shadow(0 0 10px #7fb0ff66)}
.rune{position:absolute;left:50%;bottom:0;width:120px;height:30px;transform:translateX(-50%);border-radius:50%;border:1.5px solid #8fd0ff88;box-shadow:0 0 16px #5fa8ff99,inset 0 0 12px #5fa8ff77;animation:rune 3s ease-in-out infinite}

.fld{display:block;width:min(250px,78vw);margin:0 auto 14px;text-align:center;cursor:text}
.fld span{display:block;font-size:11px;letter-spacing:6px;color:#a9c2f0;margin-bottom:2px;text-shadow:0 1px 2px #000}

  text-shadow:0 2px 0 #06102c,0 0 14px #4a7dffaa;transition:color .2s,text-shadow .2s,transform .15s}

<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d');

let PX=2,LW=200,LH=400,DPR=1,CX=0,CY=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;
  PX=Math.max(2,Math.round(Math.min(w,h)/230));LW=Math.ceil(w/PX);LH=Math.ceil(h/PX);
  low.width=lit.width=LW;low.height=lit.height=LH;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';}
addEventListener('resize',resize);resize();

// ---------- utils ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return Math.abs(d);};
const rgb=(a,k=1)=>`rgb(${clamp(a[0]*k|0,0,255)},${clamp(a[1]*k|0,0,255)},${clamp(a[2]*k|0,0,255)})`;
const shade=(P4,l)=>P4[clamp(Math.floor(l*4),0,3)];
const dith=(i,j)=>(((i&1)+(j&1)*2)/4-.375)*.2;

// ---------- sprite helpers ----------
function pix(w,h,fn,outline){const k=mk(w,h),q=k.getContext('2d'),id=q.createImageData(w,h),d=id.data,f=new Uint8Array(w*h);
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const col=fn(i,j);if(col){const o=(j*w+i)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;f[j*w+i]=1;}}
  if(outline){for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(f[j*w+i])continue;
    if((i>0&&f[j*w+i-1]===1)||(i<w-1&&f[j*w+i+1]===1)||(j>0&&f[(j-1)*w+i]===1)||(j<h-1&&f[(j+1)*w+i]===1)){const o=(j*w+i)*4;d[o]=outline[0];d[o+1]=outline[1];d[o+2]=outline[2];d[o+3]=255;f[j*w+i]=2;}}}
  q.putImageData(id,0,0);return k;}
function flipC(s){const o=mk(s.width,s.height),q=o.getContext('2d');q.translate(s.width,0);q.scale(-1,1);q.drawImage(s,0,0);return o;}
function tintC(s,col){const o=mk(s.width,s.height),q=o.getContext('2d');q.drawImage(s,0,0);q.globalCompositeOperation='source-in';q.fillStyle=col;q.fillRect(0,0,s.width,s.height);return o;}
function pack(s){const w=tintC(s,'#fff'),r=tintC(s,'#ff2a2a');return{n:s,f:flipC(s),w,wf:flipC(w),r,rf:flipC(r)};}

// skeleton hero
const BONE=[[118,108,96],[176,166,146],[222,214,194],[250,246,232]];
const CAPE=[[46,14,36],[88,24,58],[138,40,80],[186,70,110]];
const GREY=[[28,28,34],[48,48,56],[76,76,86],[108,108,120]];
function makeSkel(frame,back,eye,cape){return pix(16,24,(i,j)=>{const d=dith(i,j);
  const skull=((i-8)/5.5)**2+((j-6)/5)**2<1&&j<=10, jaw=j>=9&&j<=11&&Math.abs(i-8)<=3;
  if(skull||jaw){
    if(!back){
      if(((i-5.8)/1.5)**2+((j-7)/1.3)**2<1||((i-10.2)/1.5)**2+((j-7)/1.3)**2<1){if((i===6||i===10)&&j===7)return eye;return[22,14,28];}
      if(i===8&&j===9)return[44,30,44];
      if(j===11&&(i===6||i===8||i===10))return[64,50,58];
      if(i===11&&(j===2||j===3))return BONE[0];}
    else if(i===5&&(j===3||j===4))return BONE[0];
    return shade(BONE,.98-(j/12)*.42-(i-8)*.05+d);}
  if(j>=12&&j<=13&&i>=4&&i<=12)return shade(cape,.78-(j-12)*.22-(i-8)*.03+d);
  if(!back&&i>=11&&i<=12&&j>=14&&j<=16+frame)return shade(cape,.42+d);
  if(back){const bottom=20+(((i+frame)%3===0)?1:0);if(j>=14&&j<=bottom&&i>=4&&i<=12)return shade(cape,.66-(j-14)*.05-Math.abs(i-8)*.05+d);}
  const sw=frame;
  if((i===3&&j>=14&&j<=19-sw)||(i===13&&j>=14&&j<=18+sw))return shade(BONE,.62+d);
  if((i>=2&&i<=3&&j===20-sw)||(i>=13&&i<=14&&j===19+sw))return shade(BONE,.78);
  if(!back&&j>=14&&j<=18&&Math.abs(i-8)<=3.6-(j===18?1:0)){if(i===8)return shade(BONE,.88);return(j%2===0)?shade(BONE,.74-Math.abs(i-8)*.06+d):[30,18,36];}
  if(j>=19&&j<=20&&i>=6&&i<=10)return(j===20&&i===8)?[30,18,36]:shade(BONE,.7+d);
  const lo=frame;
  if(j>=21&&j<=23){if(i===6-(j===23?lo:0)||i===10+(j===23?lo:0))return shade(BONE,.62);if(j===23&&(i===5-lo||i===11+lo))return shade(BONE,.5);}
  return null;},[12,6,18]);}
// goblin
const GSKIN=[[32,56,26],[60,98,40],[98,142,58],[146,186,90]],LEATH=[[44,28,20],[80,52,32],[116,78,48],[156,108,66]];
function makeGoblin(frame){return pix(18,20,(i,j)=>{const d=dith(i,j);
  for(let t=0;t<=1;t+=.1){const ex=5-t*4.5,ey=6.5-t*3,r=1.35-t*.8;if(Math.hypot(i-ex,j-ey)<r||Math.hypot(i-(17-ex),j-ey)<r)return shade(GSKIN,.5+(1-t)*.25+d);}
  if(((i-9)/4.6)**2+((j-7)/4.2)**2<1){
    if(j===7&&(i===7||i===11))return[255,80,50];if(j===7&&(i===6||i===12))return[34,10,10];
    if(j===6&&i>=6&&i<=12&&i!==9)return GSKIN[0];
    if(j===10&&i>=7&&i<=11)return(i===7||i===11)?[236,230,200]:[44,16,16];
    if(j===9&&(i===7||i===11))return[236,230,200];
    if(j===8&&i===9)return GSKIN[1];
    return shade(GSKIN,.95-(j-3)/9*.5-(i-9)*.045+d);}
  if(((i-9)/4.3)**2+((j-14.5)/3.4)**2<1){if(j===16)return i===9?[226,186,72]:[30,20,16];if(j===13&&Math.abs(i-9)<3&&(i+j)%3===0)return LEATH[0];return shade(LEATH,.88-(j-11)/7*.4-(i-9)*.05+d);}
  if(Math.hypot(i-4,j-13)<1.7||Math.hypot(i-14,j-13)<1.7)return shade(GSKIN,.62+d);
  if((i===3||i===15)&&j>=14&&j<=16)return shade(GSKIN,.48);
  const lo=frame;if(j>=18&&j<=19&&((i>=6+lo&&i<=7+lo)||(i>=11-lo&&i<=12-lo)))return j===19?[30,22,20]:shade(LEATH,.3);
  return null;},[10,8,6]);}
// wolf
const FUR=[[26,26,40],[48,48,70],[82,80,110],[128,124,160]];
function makeWolf(frame){return pix(24,16,(i,j)=>{const d=dith(i,j);
  for(let t=0;t<=1;t+=.08){const tx=20+t*3,ty=8-t*5+t*t*1.5;if(Math.hypot(i-tx,j-ty)<1.7-t*.7)return shade(FUR,.5+t*.35+d);}
  if((i===5&&j>=1&&j<=3)||(i===6&&j>=2&&j<=3)||(i===8&&j>=1&&j<=3)||(i===9&&j===3))return(i===5||i===8)&&j===2?[150,90,110]:shade(FUR,.7);
  const head=((i-6)/3.6)**2+((j-5.5)/2.8)**2<1,snout=i>=1&&i<=4&&j>=5&&j<=7&&!(i===1&&j===5);
  if(head||snout){if(i===4&&j===5)return[255,214,70];if(i===1&&j===6)return[12,8,12];if(j===7&&i>=2&&i<=4)return i===3?[232,228,212]:FUR[0];return shade(FUR,.92-(j-3)/6*.45+d);}
  if(((i-14)/8)**2+((j-8)/3.6)**2<1||((i-8)/3.6)**2+((j-8.5)/3.8)**2<1){let l=.95-(j-4.5)/8*.8+d;if(j<=5)l+=.15;if((i+j*2)%7===0)l-=.18;return shade(FUR,l);}
  for(const [lx,o] of [[7,frame?1:-1],[10,frame?-1:1],[16,frame?1:-1],[19,frame?-1:1]]){if(j>=11&&j<=14){const xx=lx+(j>=13?o:0);if(i===xx||(i===xx+1&&j<14))return shade(FUR,j===14?.15:.45);}}
  return null;},[8,6,12]);}
// wraith
const ROBE=[[20,14,36],[40,26,66],[68,46,108],[104,76,156]];
function makeWraith(frame){return pix(18,24,(i,j)=>{const d=dith(i,j);
  if(((i-9)/5.2)**2+((j-7)/5.6)**2<1&&j<=11){
    if(((i-9)/3.1)**2+((j-8.5)/3.4)**2<1){if(j===8&&i>=7&&i<=11&&i!==9)return(i===7||i===11)?[170,255,255]:[60,200,220];return[6,4,10];}
    return shade(ROBE,.98-(j-1)/11*.5-(i-9)*.05+d);}
  if(j>=11&&j<=23){const hw=4+(j-11)*.36,tat=j>=20&&((i+frame*2+(j%2))%3===0);
    if(Math.abs(i-9)<=hw&&!tat){let l=.78-(j-11)/12*.5-Math.abs(i-9)*.03+d;if(Math.abs(i-9)<1&&j<18)l-=.25;return shade(ROBE,l);}}
  for(let t=0;t<=1;t+=.1){const sx=4-t*3,sy=12+t*5+(frame?t:0);if(Math.hypot(i-sx,j-sy)<1.5-t*.4||Math.hypot(i-(17-sx),j-sy)<1.5-t*.4)return shade(ROBE,.5+d);}
  if((j===18+frame||j===19+frame)&&(i<=1||i>=16))return[200,224,236];
  return null;},[6,2,12]);}
// boss
function makeBoss(){return pack(pix(44,42,(i,j)=>{
  const inE=(cx,cy,rx,ry)=>((i-cx)/rx)**2+((j-cy)/ry)**2<1;
  for(let t=0;t<=1;t+=.04){const hx=15-t*8-t*t*3,hy=10-t*7-t*t*2,rr=2.4-t*1.8;if(Math.hypot(i-hx,j-hy)<rr||Math.hypot(i-(43-hx),j-hy)<rr)return j<4?[236,226,206]:(t>.5?[206,188,168]:[166,148,130]);}
  const head=inE(22,14,8,6.5);
  if(head){if(j===13&&(i===18||i===19||i===24||i===25))return[255,70,60];if(j===14&&(i===18||i===25))return[190,30,30];
    if(j===18&&i>=19&&i<=24)return[110,16,26];if(j===17&&(i===19||i===21||i===23))return[232,222,200];}
  if(j>=37&&j<=39&&(i===4||i===6||i===8||i===35||i===37||i===39))return[226,214,192];
  const body=head||inE(22,26,14,10)||inE(12,21,7,6)||inE(32,21,7,6)||inE(7,30,4.5,8)||inE(37,30,4.5,8)||((i>=14&&i<=19||i>=25&&i<=30)&&j>=33&&j<=40);
  if(body){const P4=[[22,12,32],[42,24,58],[68,42,92],[104,70,134]];let l=.85-(j/42)*.7+(hash(i,j)-.5)*.3;if((i*3+j*7)%11===0)l+=.25;if(Math.abs(i-22)<2&&j>20&&j<32)l-=.3;
    if(inE(22,26,5,4)&&!head)return((i+j)%2)?[150,40,50]:[110,26,40];return shade(P4,l);}
  return null;},[8,4,12]));}
const HERO_META={"cw": 24, "ch": 25, "f": {"idle": [[0, 0], [24, 0], [48, 0], [72, 0]], "walk": [[96, 0], [120, 0], [144, 0], [168, 0], [0, 25], [24, 25]], "run": [[48, 25], [72, 25], [96, 25], [120, 25], [144, 25], [168, 25]], "jump": [[0, 50], [24, 50], [48, 50], [72, 50], [96, 50]], "fall": [[120, 50], [144, 50], [168, 50], [0, 75], [24, 75]], "hit": [[48, 75], [72, 75], [96, 75], [120, 75]], "bidle": [[144, 75], [168, 75], [0, 100], [24, 100]], "bwalk": [[48, 100], [72, 100], [96, 100], [120, 100], [144, 100], [168, 100]], "bjump": [[0, 125], [24, 125], [48, 125], [72, 125]], "bul": [[96, 125], [120, 125], [144, 125], [168, 125], [0, 150]]}};
const HERO={ready:false};
(function(){const im=new Image();im.onload=()=>{const cw=HERO_META.cw,ch=HERO_META.ch;
  const cut=(x,y)=>{const k=mk(cw,ch);k.getContext('2d').drawImage(im,x,y,cw,ch,0,0,cw,ch);return k;};
  for(const k in HERO_META.f)HERO[k]=HERO_META.f[k].map(([x,y])=>pack(cut(x,y)));

    if(alpha===1){const wl=Y+bobY+Math.round(img.height*.5);c.fillStyle='rgba(230,248,255,.85)';for(let i=0;i<img.width;i++)if(Math.sin(i*1.3+time*6)>-.2)c.fillRect(X+i,wl+Math.round(Math.sin(i*.7+time*5)),1,1);
